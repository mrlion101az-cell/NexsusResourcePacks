# NexusResourcePacks -- delivery layer for one or more Java resource packs.
# Resource Pack Manager (RPM/RSPM) can still do all the merging for your
# main pack; set its own config.yml `autoHost: false` so it writes the
# merged zip to plugins/ResourcePackManager/output/ instead of hosting or
# pushing it itself. This plugin hosts and delivers from there -- and can
# also host any number of OTHER pack zips alongside it, letting players
# pick which one (if any) they want with /resourcepack.

# EASIEST WAY TO ADD A PACK: just drop its .zip directly into
# plugins/NexusResourcePacks/packs/ (created automatically) -- upload it
# there the same way you'd upload any other file to your server (FTP/SFTP/
# your host's file manager), then run /resourcepack reload. The plugin
# picks it up on its own using the filename as the pack's id and display
# name (MyPack.zip -> "MyPack") -- no config.yml editing required. Delete
# the file and reload to remove it again.
packs-folder: "packs"

# Optional: prettier display names for packs dropped in packs-folder above,
# keyed by the id the plugin derived from the filename (lowercase, spaces
# and punctuation collapsed to single dashes -- e.g. "Medieval Overhaul
# v2.zip" becomes id "medieval-overhaul-v2"). Leave this empty and the
# auto-generated name (title-cased from the filename) is used instead.
display-name-overrides:
  # medieval-overhaul-v2: "Medieval Overhaul"

# Explicit packs -- for anything that lives somewhere fixed OUTSIDE
# packs-folder above, like Resource Pack Manager's merge output. Add a new
# one by adding a new entry here (any id you like, lowercase/no-spaces is
# safest) and running /resourcepack reload -- no restart, no code changes.
# Remove one the same way; anyone who had it selected falls back to
# defaults.default-pack-id (or nothing) the next time it's applied.
#
# Empty by default -- uncomment and point this at RPM's output once you
# actually have a merged pack there. An entry with no real file behind it
# is safe (the plugin won't loop trying to send a broken pack), but it
# also won't do anything, so there's no reason to keep one around unused.
packs:
  # nexus:
  #   display-name: "Nexus (main pack)"
  #   # Where RPM writes its merged pack once autoHost is false. Adjust the
  #   # relative path if your plugins folder layout differs -- this (and
  #   # every other source-file here) is relative to plugins/NexusResourcePacks/.
  #   source-file: "../ResourcePackManager/output/ResourcePackManager.zip"

hosting:
  # How this plugin's own small built-in file server is reachable from
  # players' clients. In production, put a domain + reverse proxy in front
  # of it (recommended -- that's also the easy way to add HTTPS); otherwise
  # use your server's public IP. No trailing slash.
  public-base-url: "http://YOUR_SERVER_IP:8091"
  http-port: 8091
  # How often (minutes) to check every configured/dropped pack's file for a
  # new version and re-hash/re-host it automatically -- also what notices
  # a newly dropped file or a deleted one between /resourcepack reloads.
  # Doesn't interrupt anyone already connected -- they only get the update
  # the next time the pack is (re)sent to them.
  rehash-interval-minutes: 5

prompt:
  # Shown on the client's own download-confirmation dialog when a pack is sent.
  message: "Nexus Universe has resource packs available! Pick one with /resourcepack, or play with default textures."
  # Keep this false -- required packs force a kick if declined/failed, which
  # defeats the whole point of a pick-one-or-none menu.
  required: false

defaults:
  # Which pack id (must match one of the ids under packs: above, or a
  # dropped file's derived id) a player with no recorded choice yet gets
  # sent on their very first join. Leave blank, or set to "none", to send
  # nothing until they visit /resourcepack themselves. Existing choices
  # (once someone has picked something, in either direction) always
  # override this. Set to "none" for now since no pack is configured above
  # yet -- once you add one, set this to its id if you want it to be what
  # brand-new players get automatically.
  default-pack-id: "none"
  # Automatically opens the /resourcepack picker menu a few seconds after
  # a player joins, so they can pick (or change) their pack without needing
  # to know the command exists. Their previous selection (or the default
  # above, for a first-time join) is still applied in the background either
  # way -- this just also shows them the menu.
  show-menu-on-join: true
